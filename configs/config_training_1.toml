[model]
input_shape = 5
lis_MacSumOut = [8]
lis_output_size = [1]
lis_activation = ["relu"]
lis_increments = [1]
lis_linears_start = [8]
lis_LinearN = [2]
lis_point_estim_function = ["mean"]
conjunctive_start = true

[training]
[training.optimizer]
name = "adam"
lr = 0.001

[training.loss]
name = "interval_rmse"
mode = "combined"

[training.metric]
name = "R2"
